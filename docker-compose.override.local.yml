services:

  app:
    build:
      args:
        - DEBUG_BUILD=1
    ports:
      # allow direct access without nginx
      - ${DJANGO_DEV_PORT}:8000
      - ${DEBUG_APP_DEBUGPY_PORT:-5678}:5678
    volumes:
      # mount the source for live reload
      - ./docker-app/qfieldcloud:/usr/src/app/qfieldcloud
    command: python3 -m debugpy --listen 0.0.0.0:5678 manage.py runserver 0.0.0.0:8000

  pipcompile: &default-django
    build:
      context: ./docker-app
      target: build
      network: host
    profiles:
      - donotstart
    volumes:
      # mount the source for live reload
      - ./docker-app/requirements:/requirements
    command: bash -c 'for f in /requirements/*.in; do pip-compile --no-strip-extras -o "$${f%.in}.txt" "$$f"; done'

  memcached:
    ports:
      - "${MEMCACHED_PORT}:11211"

  qgis:
    build:
      args:
        - DEBUG_BUILD=1
    volumes:
      # allow local development for `docker-qgis`
      - ./docker-qgis/qfc_worker:/usr/src/app/qfc_worker:ro
      - ./docker-qgis/entrypoint.py:/usr/src/app/entrypoint.py:ro
      # allow local development for `libqfieldsync` if host directory present; requires `PYTHONPATH=/libqfieldsync:${PYTHONPATH}`
      - ./docker-qgis/libqfieldsync:/libqfieldsync:ro
      # allow local development for `qfieldcloud-sdk-python` if host directory present; requires `PYTHONPATH=/qfieldcloud-sdk-python:${PYTHONPATH}`
      - ./docker-qgis/qfieldcloud-sdk-python:/qfieldcloud-sdk-python:ro

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    restart: unless-stopped
    volumes:
      - ${MINIO_DATA_PATH}:/data
    # - /mnt/surenvsa/surenvfs2/minio/data2:/data2
    # - /mnt/surenvsa/surenvfs3/minio/data3:/data3
    # - /mnt/surenvsa/surenvfs4/minio/data4:/data4
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: http://${QFIELDCLOUD_HOST}:${MINIO_BROWSER_PORT}
    command: server /data --console-address :9001
    healthcheck:
      test: [ "CMD", "curl", "-A", "Mozilla/5.0 (X11; Linux x86_64; rv:30.0) Gecko/20100101 Firefox/30.0", "-f", "http://localhost:9001/minio/index.html" ]
      interval: 5s
      timeout: 20s
      retries: 5
    ports:
      - ${MINIO_BROWSER_PORT}:9001
      - ${MINIO_API_PORT}:9000

  createbuckets:
    build:
      context: ./docker-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    environment:
      STORAGES: ${STORAGES}

volumes:
  postgres_data:
